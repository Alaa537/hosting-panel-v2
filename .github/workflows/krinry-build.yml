name: krinry Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - profile
          - release
      output_type:
        description: 'Output type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - appbundle
          - apk-split

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.0'
          channel: stable

      - name: Pub get
        run: flutter pub get

      - name: Create android platform
        run: flutter create --platforms android --org com.alaa --project-name hosting .

      - name: Patch AndroidManifest
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = re.sub(r'android:label="[^"]*"', 'android:label="HOST PANEL"', s, count=1)
          if 'android.permission.INTERNET' not in s:
              perms = '    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n'
              s = s.replace('<application', perms + '    <application', 1)
          if 'usesCleartextTraffic' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          p.write_text(s)
          print('manifest ok')
          PY

      - name: Icons
        run: dart run flutter_launcher_icons || true

      - name: Build
        run: |
          TYPE="${{ github.event.inputs.build_type }}"
          OUT="${{ github.event.inputs.output_type }}"
          FLAGS="--obfuscate --split-debug-info=build/symbols"
          if [ "$OUT" = "apk" ]; then
            flutter build apk --$TYPE $FLAGS
          elif [ "$OUT" = "apk-split" ]; then
            flutter build apk --$TYPE $FLAGS --split-per-abi
          else
            flutter build appbundle --$TYPE $FLAGS
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/*/*.aab
          retention-days: 7
